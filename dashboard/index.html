<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>电梯困人主动预警 · 监控看板</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #141b23;
    --panel-2: #1b242e;
    --line: #26313d;
    --text: #e8eef5;
    --muted: #8b97a5;
    --gray: #8b97a5;
    --yellow: #d29922;
    --orange: #e8712b;
    --red: #f85149;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    padding: 24px 32px 48px;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 26px; font-weight: 500; margin: 0; letter-spacing: 1px; }
  .sub { font-size: 14px; color: var(--muted); }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--red); }

  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .card .label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .card .value { font-size: 40px; font-weight: 500; line-height: 1; }
  .card .unit { font-size: 15px; color: var(--muted); margin-left: 4px; }

  .bar { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .bar .tag { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .bar .warn { color: var(--orange); border-color: #4a3020; background: #26180f; }

  .section-title { font-size: 16px; color: var(--muted); margin: 8px 0 14px; letter-spacing: 1px; }

  #list { display: flex; flex-direction: column; gap: 12px; }
  .alert {
    display: grid; grid-template-columns: 6px 1fr auto; gap: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    animation: slide .28s ease-out;
  }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .stripe { background: var(--gray); }
  .body { padding: 16px 20px; }
  .row1 { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .floor { font-size: 34px; font-weight: 500; line-height: 1; min-width: 76px; }
  .badge { font-size: 14px; padding: 3px 10px; border-radius: 6px; border: 1px solid currentColor; }
  .event { font-size: 19px; font-weight: 500; }
  .meta { font-size: 14px; color: var(--muted); }
  .reasons { display: flex; gap: 8px; flex-wrap: wrap; }
  .reasons code {
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 9px; color: #b9c6d4;
  }
  .side { padding: 16px 20px; display: flex; align-items: center; }
  button {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  button:hover { border-color: var(--muted); background: var(--panel-2); }
  button:active { transform: translateY(1px); }

  .pulse .stripe { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .empty { color: var(--muted); font-size: 16px; padding: 40px; text-align: center;
           border: 1px dashed var(--line); border-radius: 12px; }
  .stale { opacity: .45; }
  footer { margin-top: 32px; font-size: 13px; color: #5f6b78; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>电梯困人主动预警</h1>
  <span class="sub">采集「人的处境」，而不只是「机器故障」</span>
  <span class="conn"><span id="dot" class="dot"></span><span id="connText">连接中…</span></span>
</header>

<div class="cards">
  <div class="card"><div class="label">今日告警</div><div class="value" id="cToday">–</div></div>
  <div class="card"><div class="label">未处理</div><div class="value" id="cActive">–</div></div>
  <div class="card"><div class="label">平均响应</div><div class="value" id="cAck">–<span class="unit">秒</span></div></div>
  <div class="card"><div class="label">设备在线</div><div class="value" id="cDev">–</div></div>
</div>

<div class="bar">
  <span class="tag" id="tDb">数据层：–</span>
  <span class="tag" id="tCache">缓存层：–</span>
  <span class="tag" id="tOffline" style="display:none"></span>
</div>

<div class="section-title">实时告警</div>
<div id="list"><div class="empty">正在加载…</div></div>

<footer>
  <div>紧急度：<span style="color:var(--gray)">0 正常</span> · <span style="color:var(--yellow)">1 关注</span> · <span style="color:var(--orange)">2 告警</span> · <span style="color:var(--red)">3 紧急</span></div>
  <div>每 2 秒轮询 · 同设备同紧急度 30 秒内去重 · 断网自动降级 sqlite + memory</div>
</footer>

<script>
const URG = {
  0: { label: "正常", color: "#8b97a5" },
  1: { label: "关注", color: "#d29922" },
  2: { label: "告警", color: "#e8712b" },
  3: { label: "紧急", color: "#f85149" }
};
const EVT = {
  normal: "正常乘梯", estop: "电梯急停", trapped: "人员被困", pry: "扒门求助", faint: "有人倒地"
};

const $ = (id) => document.getElementById(id);
let lastIds = new Set();

function fmtTime(ms) {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function setConn(ok) {
  $("dot").className = "dot " + (ok ? "on" : "off");
  $("connText").textContent = ok ? "实时在线" : "连接断开";
}

function renderStats(s) {
  $("cToday").textContent = s.today_total ?? 0;
  $("cActive").textContent = s.active_count ?? 0;
  $("cAck").innerHTML = (s.avg_ack_seconds ?? 0) + '<span class="unit">秒</span>';
  $("cDev").textContent = (s.devices_online ?? 0) + " / " + (s.devices_total ?? 0);
  $("tDb").textContent = "数据层：" + (s.db_mode === "rds" ? "华为云 RDS" : "SQLite 兜底");
  $("tCache").textContent = "缓存层：" + (s.cache_mode === "redis" ? "华为云 Redis" : "内存兜底");
}

function renderOffline(devices) {
  const off = (devices || []).filter((d) => !d.online);
  const el = $("tOffline");
  if (!off.length) { el.style.display = "none"; return; }
  el.style.display = "";
  el.className = "tag warn";
  el.textContent = off.length + " 台设备离线：" + off.map((d) => d.device_id).join("、");
}

function renderAlerts(items) {
  const list = $("list");
  if (!items.length) {
    list.innerHTML = '<div class="empty">当前无活动告警 · 系统运行正常</div>';
    lastIds = new Set();
    return;
  }
  items.sort((a, b) => (b.urgency - a.urgency) || (b.ts - a.ts));
  list.innerHTML = items.map((a) => {
    const u = URG[a.urgency] || URG[0];
    const reasons = (a.reason || []).map((r) => "<code>" + escapeHtml(r) + "</code>").join("");
    const cls = "alert" + (a.urgency >= 3 ? " pulse" : "");
    return (
      '<div class="' + cls + '">' +
        '<div class="stripe" style="background:' + u.color + '"></div>' +
        '<div class="body">' +
          '<div class="row1">' +
            '<span class="floor">' + escapeHtml(a.location || "?") + '</span>' +
            '<span class="event">' + (EVT[a.event_type] || a.event_type) + '</span>' +
            '<span class="badge" style="color:' + u.color + '">' + u.label + '</span>' +
            '<span class="meta">' + (a.people_count || 0) + ' 人 · 置信度 ' +
              Math.round((a.confidence || 0) * 100) + '% · ' + fmtTime(a.ts) + '</span>' +
          '</div>' +
          '<div class="reasons">' + reasons + '</div>' +
        '</div>' +
        '<div class="side"><button data-id="' + a.id + '">确认处置</button></div>' +
      '</div>'
    );
  }).join("");
  list.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", () => ack(btn.dataset.id, btn));
  });
  lastIds = new Set(items.map((a) => a.id));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function ack(id, btn) {
  btn.disabled = true;
  btn.textContent = "处理中…";
  try {
    const r = await fetch("/api/v1/alerts/" + id + "/ack", { method: "POST" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    await refresh();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "重试";
    setConn(false);
  }
}

async function refresh() {
  try {
    const [aRes, sRes, dRes] = await Promise.all([
      fetch("/api/v1/alerts?status=active&limit=50"),
      fetch("/api/v1/stats"),
      fetch("/api/v1/devices")
    ]);
    if (!aRes.ok || !sRes.ok || !dRes.ok) throw new Error("bad status");
    const alerts = await aRes.json();
    const stats = await sRes.json();
    const devs = await dRes.json();
    renderAlerts(alerts.items || []);
    renderStats(stats);
    renderOffline(devs.items || []);
    setConn(true);
  } catch (e) {
    setConn(false);
    $("list").classList.add("stale");
  }
  setTimeout(refresh, 2000);
}

refresh();
</script>
</body>
</html>
